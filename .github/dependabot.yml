version: 2
updates:
  # No pip entry: the API installs from apps/api/requirements.lock (pip-compile,
  # with hashes), which Dependabot does not update, so its pip PRs only raised
  # floors in pyproject.toml. Python upgrades: `make lock-upgrade` (tracker row 58).

  # npm — apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Next 16 type-checks with TypeScript 7 only behind experimental.useTypeScriptCli
      # (2026-11-18). Drop this once Next supports TS 7 by default.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The types follow the Node major the app runs on (apps/web/Dockerfile, CI,
      # .nvmrc), so a new major moves with the runtime, by hand. Types ahead of the
      # runtime would let code use Node APIs that production doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Compose images: the pinned Garage tag (tracker row 41), Postgres, Redis, Caddy.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Never a major version from a bot: CI starts every store empty, so it cannot
      # see that a Postgres 16 data folder will not open in Postgres 17+, or that a
      # Garage major (v1 -> v2 did) needs a migration step first. Majors are done by
      # hand with a plan. Minor and patch updates still come through.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
