version: 2
updates:
  # No pip entry: the API installs from apps/api/requirements.lock (pip-compile,
  # with hashes), which Dependabot does not update, so its pip PRs only raised
  # floors in pyproject.toml. Python upgrades: `make lock-upgrade` (tracker row 58).

  # npm — apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Next 16 type-checks with TypeScript 7 only behind experimental.useTypeScriptCli
      # (2026-11-18). Drop this once Next supports TS 7 by default.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
